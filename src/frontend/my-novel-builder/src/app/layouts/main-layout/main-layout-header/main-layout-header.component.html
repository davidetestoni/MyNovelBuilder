<div class="header">
  <div class="logo" [routerLink]="['/']">
    <img
      src="../../../assets/images/logo/mnb_logo.svg"
      alt="My Novel Builder Logo"
    />
    <div class="logo-text">My Novel Builder</div>
  </div>
  <nav class="navigation">
    <div
      class="nav-item"
      [routerLink]="['/novels']"
      [routerLinkActive]="['active']"
    >
      <i class="icon icon-novels"></i>
      <span>Novels</span>
    </div>
    <div
      class="nav-item"
      [routerLink]="['/chat']"
      [routerLinkActive]="['active']"
    >
      <i class="icon icon-chats"></i>
      <span>Chat</span>
    </div>
    <div
      class="nav-item"
      [routerLink]="['/compendia']"
      [routerLinkActive]="['active']"
    >
      <i class="icon icon-compendium"></i>
      <span>Compendia</span>
    </div>
    <div
      class="nav-item"
      [routerLink]="['/prompts']"
      [routerLinkActive]="['active']"
    >
      <i class="icon icon-prompt"></i>
      <span>Prompts</span>
    </div>
    <div
      class="nav-item"
      [routerLink]="['/media-library']"
      [routerLinkActive]="['active']"
    >
      <i class="icon icon-media"></i>
      <span>Media</span>
    </div>
    <div
      class="nav-item"
      [routerLink]="['/integrations']"
      [routerLinkActive]="['active']"
    >
      <i class="icon icon-integration"></i>
      <span>Integrations</span>
    </div>
  </nav>
</div>
