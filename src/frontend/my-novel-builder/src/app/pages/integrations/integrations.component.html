<div class="integrations-container">
  <h2>Integrations</h2>

  <form
    [formGroup]="integrationsForm"
    (ngSubmit)="onSubmit()"
    class="integration-form"
  >
    <h3>OpenRouter</h3>

    @if (hasOpenRouterApiKey) {
      <div class="api-key-status">
        <i
          class="pi pi-check-circle"
          style="color: green; margin-right: 0.5rem"
        ></i>
        <span>An OpenRouter API key is currently configured.</span>
      </div>
    } @else {
      <p>No OpenRouter API key is configured.</p>
    }

    <div class="form-group">
      <label for="openRouterApiKey">Enter New OpenRouter API Key:</label>
      <p-password
        id="openRouterApiKey"
        formControlName="openRouterApiKey"
        placeholder="sk-or-..."
        [feedback]="false"
        [toggleMask]="true"
      />
    </div>

    <p-button
      class="save-button"
      type="submit"
      label="Save"
      [disabled]="!integrationsForm.valid"
    />
  </form>
</div>
