<div class="integrations-container">
  <h2>Integrations</h2>

  <form [formGroup]="integrationsForm" (ngSubmit)="onSubmit()" class="integration-form">
    <h3>OpenRouter</h3>

    @if (hasOpenRouterApiKey) {
      <div class="api-key-status">
        <p><span class="check-icon">✓</span> An OpenRouter API key is currently configured.</p>
      </div>
    } @else {
      <p>No OpenRouter API key is configured.</p>
    }


    <div class="form-group">
      <label for="openRouterApiKey">Enter New OpenRouter API Key:</label>
      <input
        id="openRouterApiKey"
        type="password"
        formControlName="openRouterApiKey"
        placeholder="sk-or-..."
        autocomplete="off"
        />
    </div>

    <button type="submit" [disabled]="!integrationsForm.valid" class="save-button">Save</button>
  </form>
</div>
