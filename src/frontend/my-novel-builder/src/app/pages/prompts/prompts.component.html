<div class="prompts-container">
  <h1>Prompts</h1>
  @if (prompts === null) {
    <p>Loading...</p>
  } @else {
    <div class="prompts-editor">
      <!-- Left panel with the list of prompts and a button to add a new one -->
      <div class="prompts">
        <div class="prompts-actions">
          <p-button class="add-prompt" (click)="openCreatePromptDialog()">
            Add Prompt
          </p-button>
        </div>
        <div class="prompts-filters">
          <p-select
            [(ngModel)]="selectedPromptType"
            [options]="promptTypeOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="All Prompts"
            [showClear]="true"
            [style]="{ width: '100%' }"
          />
        </div>
        <div class="prompts-list">
          @for (prompt of getFilteredPrompts(); track prompt.id) {
            <div
              class="prompt"
              [class.selected]="currentPrompt?.id === prompt.id"
              (click)="setCurrentPrompt(prompt)"
            >
              <span>{{ prompt.name }}</span>
            </div>
          }
        </div>
      </div>
      @if (currentPrompt !== null) {
        <div class="prompt">
          <app-prompt
            [prompt]="currentPrompt"
            (updatePrompt)="updatePrompt($event)"
            (deletePrompt)="deletePrompt($event)"
          />
        </div>
      }
    </div>
  }
</div>
