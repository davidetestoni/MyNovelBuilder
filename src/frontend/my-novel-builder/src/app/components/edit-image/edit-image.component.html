<div class="modal-container">
  <div class="form-container">
    <form [formGroup]="formGroup">
      <div class="form-row">
        <div class="form-column left-column">
          <div class="form-field">
            <label for="model" class="form-field-label">Model *</label>
            <app-model-select
              id="model"
              formControlName="model"
              capability="imageEdit"
              placeholder="Select an editor model"
              width="100%"
            />
          </div>
          <div class="form-field">
            <label for="prompt" class="form-field-label">Prompt</label>
            <textarea
              pTextarea
              id="prompt"
              formControlName="prompt"
              placeholder="Describe the changes you want to make..."
              [autoResize]="true"
              rows="5"
            ></textarea>
          </div>
        </div>
        <div class="form-column">
          <div class="image-previews">
            @if (originalImagePreview !== null) {
              <div class="image-preview-container">
                <span class="preview-label">Original</span>
                <div class="preview-image">
                  <img [src]="originalImagePreview" alt="Original Image" />
                </div>
              </div>
            }
            @if (imagePreview !== null) {
              <div class="image-preview-container">
                <span class="preview-label">Edited</span>
                <div class="preview-image">
                  <img [src]="imagePreview" alt="Edited Image" />
                </div>
              </div>
            }
          </div>
        </div>
      </div>
      <div class="form-buttons-container">
        <p-button
          label="{{ editButtonLabel }}"
          (click)="editImage()"
          [disabled]="isGenerating || formGroup.invalid || !originalImage"
          [loading]="isGenerating"
          variant="text"
        />
        @if (generationStatusLabel; as statusLabel) {
          <span class="generation-status">{{ statusLabel }}</span>
        }
        @if (imageBlob !== null) {
          <p-button
            label="Accept"
            (click)="accept()"
            [disabled]="imageBlob === null"
          />
        }
      </div>
    </form>
  </div>
</div>
