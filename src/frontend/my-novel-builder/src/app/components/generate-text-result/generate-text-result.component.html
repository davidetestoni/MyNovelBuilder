<div class="modal-container">
  <div class="result-container">
    @if (data.textToReplace.length > 0) {
      <div class="text-to-replace">
        <div class="text-to-replace-title">
          <span>Text to Replace</span>
        </div>
        <div class="text-to-replace-content">
          <div [innerHTML]="data.textToReplace"></div>
        </div>
      </div>
    }
    <div class="generated-text">
      @if (data.textToReplace.length > 0) {
        <div class="generated-text-title">
          <span>Generated Text</span>
        </div>
      }
      <div class="generated-text-content">
        <div [innerHTML]="generatedText"></div>
      </div>
    </div>
    <div class="result-actions">
      <p-button label="Back" (click)="goBack()" [disabled]="isGenerating" />
      <p-button
        label="{{ retryButtonLabel }}"
        (click)="generateText()"
        [disabled]="isGenerating"
      />
      @if (generationStatusLabel; as statusLabel) {
        <span class="generation-status">{{ statusLabel }}</span>
      }
      <p-button
        label="{{ data.textToReplace.length > 0 ? 'Replace' : 'Insert' }}"
        (click)="accept()"
        [disabled]="isGenerating"
      />
      <p-button label="Discard" (click)="discard()" [disabled]="isGenerating" />
    </div>
  </div>
</div>
