@if (folder === null) {
  <div class="studio-empty-state">Select a linked folder to use the studio.</div>
} @else {
  <div class="studio">
    <div class="studio-header">
      <h2>Image Generation Studio</h2>
    </div>

    <form class="studio-form" [formGroup]="formGroup">
      <div class="form-field">
        <label for="studioModel" class="form-field-label">Model *</label>
        <app-model-select
          id="studioModel"
          formControlName="model"
          capability="imageGeneration"
          placeholder="Select a model"
          width="100%"
        />
      </div>

      <div class="form-row">
        <div class="form-field grow">
          <label for="studioPrompt" class="form-field-label">Prompt</label>
          <textarea
            pTextarea
            id="studioPrompt"
            formControlName="prompt"
            placeholder="Describe the image you want to generate..."
            [autoResize]="true"
            rows="5"
          ></textarea>
        </div>

        <div class="form-field batch-size-field">
          <label for="studioBatchSize" class="form-field-label">Images</label>
          <p-select
            inputId="studioBatchSize"
            formControlName="batchSize"
            [options]="batchSizeOptions"
            optionLabel="label"
            optionValue="value"
            [style]="{ width: '100%' }"
          />
        </div>
      </div>

      <div class="form-actions">
        <p-button
          type="button"
          [label]="generateButtonLabel"
          (onClick)="generateImages()"
          [disabled]="isGenerating || formGroup.invalid"
          [loading]="isGenerating"
        />

        @if (generationStatusLabel; as statusLabel) {
          <span class="generation-status">{{ statusLabel }}</span>
        }
      </div>
    </form>

    @if (generatedImages.length > 0) {
      <div class="generated-images-grid">
        @for (image of generatedImages; track image.id; let index = $index) {
          <div class="generated-image-card">
            <div class="generated-image-frame">
              <img [src]="image.previewUrl" [alt]="'Generated image ' + (index + 1)" />
            </div>

            <p-button
              type="button"
              class="save-button"
              [label]="image.isSaved ? 'Saved' : 'Save to Folder'"
              [disabled]="image.isSaved"
              [loading]="image.isSaving"
              (onClick)="saveGeneratedImage(image, index)"
            />
          </div>
        }
      </div>
    }
  </div>
}
