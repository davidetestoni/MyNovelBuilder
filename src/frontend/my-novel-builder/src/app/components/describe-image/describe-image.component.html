<div class="modal-container">
  <div class="form-container">
    <form [formGroup]="formGroup">
      <div class="form-row">
        <div class="form-column left-column">
          <div class="form-field">
            <label for="promptId" class="form-field-label">Prompt *</label>
            <app-prompt-select
              id="promptId"
              formControlName="promptId"
              [promptType]="selectedPromptType"
              [storagePromptType]="selectedPromptType"
              (optionsChanged)="onPromptOptionsChanged($event)"
              placeholder="Select a prompt"
              width="100%"
            />
          </div>
          <div class="form-field">
            <label for="model" class="form-field-label">Model *</label>
            <app-model-select
              id="model"
              formControlName="model"
              capability="vision"
              placeholder="Select a model"
              width="100%"
            />
          </div>
          <div class="form-field">
            <label for="instructions" class="form-field-label">Instructions</label>
            <textarea
              pTextarea
              id="instructions"
              formControlName="instructions"
              placeholder="Additional instructions for how to describe the image..."
              [autoResize]="true"
              rows="4"
            ></textarea>
          </div>
          @if (description !== null) {
            <div class="form-field">
              <label for="description" class="form-field-label">Description</label>
              <textarea
                pTextarea
                id="description"
                [ngModel]="description"
                (ngModelChange)="description = $event"
                [ngModelOptions]="{ standalone: true }"
                [autoResize]="true"
                rows="7"
              ></textarea>
            </div>
          }
        </div>
        @if (imagePreview !== null) {
          <div class="form-column image-column">
            <div class="source-image">
              <img [src]="imagePreview" alt="Image to describe" />
            </div>
          </div>
        }
      </div>
      <div class="form-buttons-container">
        <p-button
          label="{{ isGenerating ? 'Describing...' : 'Describe' }}"
          (click)="describeImage()"
          [disabled]="
            isGenerating ||
            formGroup.invalid ||
            promptCount === 0
          "
          [loading]="isGenerating"
          variant="text"
        />
        @if (description !== null && description.trim() !== '') {
          <p-button label="Accept" (click)="accept()" />
        }
      </div>
    </form>
  </div>
</div>
