<div class="modal-container">
  <div class="form-container">
    <form [formGroup]="formGroup">
      <div class="form-row">
        <div class="form-column left-column">
          <div class="form-field">
            <label for="model" class="form-field-label">Model *</label>
            <app-model-select
              id="model"
              formControlName="model"
              capability="imageGeneration"
              placeholder="Select a model"
              width="100%"
            />
          </div>
          <div class="form-field">
            <label for="prompt" class="form-field-label">Prompt</label>
            <textarea
              pTextarea
              id="prompt"
              formControlName="prompt"
              placeholder="Describe the image you want to generate..."
              [autoResize]="true"
              rows="5"
            ></textarea>
          </div>
        </div>
        @if (imagePreview !== null) {
          <div class="form-column">
            <div class="generated-image">
              <img [src]="imagePreview" alt="Generated Image" />
            </div>
          </div>
        }
      </div>
      <div class="form-buttons-container">
        @if (isPromptGenerationEnabled()) {
          <p-button
            label="Generate prompt"
            (click)="openGeneratePromptDialog()"
            [disabled]="
              isGenerating ||
              isLoadingPromptGenerationPrompts ||
              !canGeneratePrompt()
            "
            variant="text"
          />
        }
        <p-button
          label="{{ generateButtonLabel }}"
          (click)="generateImage()"
          [disabled]="isGenerating || formGroup.invalid"
          [loading]="isGenerating"
          variant="text"
        />
        @if (generationStatusLabel; as statusLabel) {
          <span class="generation-status">{{ statusLabel }}</span>
        }
        @if (imageBlob !== null) {
          <p-button
            label="Accept"
            (click)="accept()"
            [disabled]="imageBlob === null"
          />
        }
      </div>
    </form>
  </div>
</div>
